
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f7fc">
<title>LIFEUP – Ton quotidien, tes objectifs</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f8f7fc;
  color: #24233a;
}

header {
  background: #292644;
  color: white;
  padding: 25px 20px 30px;
  border-radius: 0 0 25px 25px;
}

.logo {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 2px;
}

.logo span {
  color: #c4b5fd;
}

header p {
  margin-top: 9px;
  color: #dedbed;
  font-size: 14px;
}

main {
  max-width: 750px;
  margin: auto;
  padding: 22px 16px 40px;
}

.welcome {
  margin-bottom: 23px;
}

.welcome h1 {
  font-size: 23px;
  margin-bottom: 7px;
}

.welcome p {
  color: #77758b;
  font-size: 14px;
}

.section-title {
  font-size: 17px;
  margin-bottom: 14px;
}

.modules {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.module {
  background: white;
  border: 1px solid #eeedf4;
  border-radius: 17px;
  padding: 18px 14px;
  min-height: 125px;
  cursor: pointer;
  text-align: left;
  color: #292644;
  transition: 0.2s;
}

.module:active {
  transform: scale(0.97);
}

.emoji {
  font-size: 27px;
  display: block;
  margin-bottom: 12px;
}

.module strong {
  display: block;
  font-size: 14px;
  margin-bottom: 5px;
}

.module small {
  color: #858397;
  font-size: 11px;
}

.panel {
  display: none;
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-top: 22px;
  border: 1px solid #eeedf4;
}

.panel.active {
  display: block;
}

.panel h2 {
  margin-bottom: 10px;
  font-size: 20px;
}

.panel p {
  color: #77758b;
  font-size: 13px;
  margin-bottom: 15px;
  line-height: 1.5;
}

textarea {
  width: 100%;
  min-height: 140px;
  padding: 13px;
  border: 1px solid #dedbea;
  border-radius: 12px;
  font-family: inherit;
  font-size: 14px;
  resize: vertical;
  outline: none;
}

textarea:focus {
  border-color: #8b7bd1;
}

.save {
  background: #7163b5;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 10px;
  margin-top: 12px;
  font-weight: 600;
  cursor: pointer;
}

.back {
  background: #efedf7;
  color: #49436d;
  border: none;
  padding: 10px 14px;
  border-radius: 10px;
  margin-bottom: 17px;
  cursor: pointer;
}

.message {
  margin-top: 10px;
  color: #39805c;
  font-size: 12px;
}

footer {
  text-align: center;
  color: #9996aa;
  font-size: 11px;
  padding: 25px;
}

@media (max-width: 350px) {
  .modules {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">LIFE<span>UP</span></div>
  <p>Ton quotidien. Tes objectifs. Ton évolution.</p>
</header>

<main>

  <div class="welcome" id="welcome">
    <h1>Bienvenue sur LIFEUP ✨</h1>
    <p>Organise ta vie et avance vers tes objectifs, à ton rythme.</p>
  </div>

  <h2 class="section-title" id="modulesTitle">Que souhaites-tu faire aujourd'hui ?</h2>

  <div class="modules" id="modules">

    <button class="module" onclick="openModule('finances')">
      <span class="emoji">💰</span>
      <strong>Mes finances</strong>
      <small>Budget, dépenses et épargne</small>
    </button>

    <button class="module" onclick="openModule('etudes')">
      <span class="emoji">📚</span>
      <strong>Mes études</strong>
      <small>Révisions et organisation</small>
    </button>

    <button class="module" onclick="openModule('repas')">
      <span class="emoji">🥗</span>
      <strong>Mes repas</strong>
      <small>Menus et listes de courses</small>
    </button>

    <button class="module" onclick="openModule('habitudes')">
      <span class="emoji">🌱</span>
      <strong>Mes habitudes</strong>
      <small>Routines et objectifs</small>
    </button>

    <button class="module" onclick="openModule('marketing')">
      <span class="emoji">📱</span>
      <strong>Marketing digital</strong>
      <small>Idées et création de contenu</small>
    </button>

    <button class="module" onclick="openModule('emploi')">
      <span class="emoji">💼</span>
      <strong>Mon emploi</strong>
      <small>CV et candidatures</small>
    </button>

    <button class="module" onclick="openModule('activite')">
      <span class="emoji">🏪</span>
      <strong>Mon activité</strong>
      <small>Clients et rendez-vous</small>
    </button>

  </div>

  <section class="panel" id="panel">
    <button class="back" onclick="goBack()">← Retour</button>
    <h2 id="panelTitle"></h2>
    <p id="panelDescription"></p>
    <textarea id="notes" placeholder="Écris ici tes idées, tes objectifs ou tes informations..."></textarea>
    <button class="save" onclick="saveNotes()">Enregistrer</button>
    <div class="message" id="message"></div>
  </section>

</main>

<footer>
  LIFEUP © 2026 – Avance à ton rythme.
</footer>

<script>
const modules = {
  finances: {
    title: "💰 Mes finances",
    description: "Note ton budget, tes dépenses, tes économies et tes objectifs financiers."
  },
  etudes: {
    title: "📚 Mes études",
    description: "Organise tes révisions, tes cours, tes examens et tes objectifs scolaires."
  },
  repas: {
    title: "🥗 Mes repas",
    description: "Prépare tes menus, tes recettes et tes prochaines listes de courses."
  },
  habitudes: {
    title: "🌱 Mes habitudes",
    description: "Écris tes routines, tes bonnes habitudes et les objectifs que tu souhaites atteindre."
  },
  marketing: {
    title: "📱 Marketing digital",
    description: "Note tes idées de contenu, tes projets et tes stratégies marketing."
  },
  emploi: {
    title: "💼 Mon emploi",
    description: "Suis tes candidatures, tes entretiens et tes recherches d'emploi."
  },
  activite: {
    title: "🏪 Mon activité",
    description: "Organise tes idées professionnelles, tes clients et tes rendez-vous."
  }
};

let currentModule = "";

function openModule(name) {
  currentModule = name;

  document.getElementById("welcome").style.display = "none";
  document.getElementById("modulesTitle").style.display = "none";
  document.getElementById("modules").style.display = "none";

  const panel = document.getElementById("panel");
  panel.classList.add("active");

  document.getElementById("panelTitle").textContent = modules[name].title;
  document.getElementById("panelDescription").textContent = modules[name].description;

  document.getElementById("notes").value =
    localStorage.getItem("lifeup-" + name) || "";

  document.getElementById("message").textContent = "";
  window.scrollTo(0, 0);
}

function saveNotes() {
  localStorage.setItem(
    "lifeup-" + currentModule,
    document.getElementById("notes").value
  );

  document.getElementById("message").textContent =
    "✓ Tes notes ont été enregistrées sur cet appareil.";
}

function goBack() {
  document.getElementById("panel").classList.remove("active");
  document.getElementById("welcome").style.display = "block";
  document.getElementById("modulesTitle").style.display = "block";
  document.getElementById("modules").style.display = "grid";
  window.scrollTo(0, 0);
}
</script>

</body>
</html>
